name: Agent Desk

on:
  pull_request:
    paths:
      - 'apps/agent-desk/**'
      - '.github/workflows/agent-desk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/agent-desk/**'
      - '.github/workflows/agent-desk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Native desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: apps/agent-desk
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/agent-desk/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent-desk/src-tauri -> target
          key: native-release-v1
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf webkit2gtk-driver xvfb
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Rust core and renderer bridge tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust core lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run dist:linux
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Prepare downloads and integrity manifest
        run: node scripts/prepare-release.mjs
      - name: Install native test driver
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Match native WebView driver
        run: node scripts/setup-webdriver.mjs
      - name: Native desktop integration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Native desktop integration on Windows
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Install packaged app for verification
        run: node scripts/prepare-packaged-test.mjs
      - name: Packaged terminal lifecycle on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop -- --grep "finds and resumes"
      - name: Packaged terminal lifecycle on Windows
        if: runner.os == 'Windows'
        run: npm run test:desktop -- --grep "finds and resumes"
      - name: Find preserved Electron comparison artifact
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-electron-baseline.mjs
      - name: Measure warmed process trees on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/measure-resources.mjs --binary src-tauri/target/release/agent-desk --output test-results/resources/comparison.json
      - name: Measure warmed process trees on Windows
        if: runner.os == 'Windows'
        run: node scripts/measure-resources.mjs --binary src-tauri/target/release/agent-desk.exe --baseline-provenance test-results/resources/electron-baseline-provenance.json --allow-baseline-failure --output test-results/resources/comparison.json
      - name: Test and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-desk-tests-${{ matrix.os }}
          path: apps/agent-desk/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Desktop downloads
        uses: actions/upload-artifact@v4
        with:
          name: agent-desk-${{ matrix.os }}
          path: apps/agent-desk/release/
          if-no-files-found: error
          retention-days: 30

  linux-resource-comparison:
    name: Packaged resource comparison · Ubuntu 26.04
    needs: desktop
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent-desk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0t64 libnss3 libasound2t64 xvfb xauth
      - name: Download verified Ubuntu 24.04 package
        uses: actions/download-artifact@v4
        with:
          name: agent-desk-ubuntu-24.04
          path: apps/agent-desk/release
      - name: Extract packaged app for measurement
        run: |
          chmod +x release/*.AppImage
          node scripts/prepare-packaged-test.mjs
      - name: Find preserved Electron comparison artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-electron-baseline.mjs
      - name: Compare warmed packaged process trees
        run: xvfb-run -a node scripts/measure-resources.mjs --binary "$AGENT_DESK_BINARY" --app-root "${AGENT_DESK_BINARY%/*}" --baseline-provenance test-results/resources/electron-baseline-provenance.json --output test-results/resources/comparison.json
      - name: Resource comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-desk-resources-ubuntu-26.04
          path: apps/agent-desk/test-results/
          if-no-files-found: ignore
          retention-days: 14
