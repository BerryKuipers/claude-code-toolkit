name: Context and broker regressions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/context-checks.yml'
      - '.claude/rules/**'
      - 'scripts/sync-claude-toolkit.sh'
      - 'scripts/sync-rule-files.sh'
      - 'scripts/retired-rule-hashes.sha256'
      - 'scripts/tests/**'
      - 'docs/archive/2026-11-26-rules/**'
      - 'submodules/mcp-broker/**'

permissions:
  contents: read

concurrency:
  group: context-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: submodules/mcp-broker/package-lock.json
      - name: Verify distribution with isolated fixture projects
        run: |
          bash -n scripts/sync-rule-files.sh scripts/sync-claude-toolkit.sh
          node --test scripts/tests/sync-rule-files.test.mjs
      - name: Install pinned broker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: submodules/mcp-broker
      - name: Verify MCP protocols with synthetic local servers
        run: npm test
        working-directory: submodules/mcp-broker
