[package]
name = "agent-desk"
version = "0.2.0"
description = "One desktop workspace for coding agents, sessions, models and skills"
authors = ["Berry Kuipers"]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "agent_desk"
crate-type = ["rlib"]

[[bin]]
name = "agent-desk"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:dirs"]

[build-dependencies]
tauri-build = { version = "2.7.2", optional = true }

[dependencies]
tauri = { version = "=2.12.3", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }
indexmap = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
toml = "0.9"
serde_yaml_ng = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "4.2", features = ["v1"] }
dirs = { version = "6", optional = true }
portable-pty = "0.9"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
